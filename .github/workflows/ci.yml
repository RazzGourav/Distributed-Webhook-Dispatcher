name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dispatcher
          POSTGRES_PASSWORD: dispatcher
          POSTGRES_DB: dispatcher_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatcher -d dispatcher_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dispatcher:dispatcher@localhost:5432/dispatcher_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.13.9"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=dispatcher --cov-report=term-missing
      - run: uv export --no-header --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt && diff requirements.txt /tmp/requirements.txt
