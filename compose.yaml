services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher
      POSTGRES_DB: dispatcher
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d dispatcher"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://dispatcher:dispatcher@db:5432/dispatcher
      API_KEY: ${API_KEY:?Run python scripts/init_env.py first}
      EMBEDDED_WORKER: "true"
      DEMO_ENABLED: "true"
      # Local demo only: allows api to POST to its own container port.
      ALLOW_PRIVATE_NETWORKS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 25s
volumes:
  postgres_data:
